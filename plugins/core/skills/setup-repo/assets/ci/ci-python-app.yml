name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Latest uv until the app has an image. Once its Dockerfile pins
      # ARG UV_VERSION, install that version here instead: claude-shared ADR
      # 2026-09-23-python-apps-lock-with-uv, §2.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # --locked fails the job when uv.lock no longer matches pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Pre-commit
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure

      - name: Pytest
        run: uv run --locked pytest
