# Runs the ci-status skill's tests. They need only pytest: the script under test
# calls gh, and the tests stand a fake in its place.
name: ci-status tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install pytest
        run: uv pip install --system pytest

      - name: Run the tests
        run: python -m pytest tests/ci-status
